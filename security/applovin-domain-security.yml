method: probed
source: live DNS/TLS/HTTP probes of every apis.yml baseURL host, every OpenAPI servers[] host, and the website/portal hosts
note: >-
  Every AppLovin host negotiates TLS 1.3 with a valid certificate, and the applovin.com
  domain publishes SPF and a DMARC policy of `reject` — the strongest email posture
  available. The gaps are in the API layer: HSTS is set on the marketing site and the
  dashboard but NOT on any of the four API hosts, there is no CAA record on either
  registrable domain, and DNSSEC is not enabled on either. The four API hosts also carry
  no /.well-known/ surface at all (see well-known/applovin-well-known.yml).
