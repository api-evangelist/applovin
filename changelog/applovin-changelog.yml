scope: sdk-only
note: >-
  AppLovin publishes a dated changelog for its CLIENT SDKs and for its oRTB specification.
  It publishes NO changelog for any of its HTTP APIs — there is no release-notes page for
  the Ad Unit Management, Campaign Management, Reporting, Conversion or Ad Review APIs, and
  the reporting family is not versioned at all. An integrator has no way to learn that a
  reporting column, a request window, or a rate limit changed. The entries below are the
  MAX Android SDK line, which is the closest thing to a versioned public release stream
  AppLovin operates.
  The docs changelog pages at support.applovin.com are client-rendered and return an empty
  document to a non-JS fetch (verified 2026-08-13), so the structured entries below were
  read from the GitHub release feed for the same artifact, which carries the same version
  numbers and real publication dates.
versioning:
