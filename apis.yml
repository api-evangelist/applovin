description: AppLovin is a marketing platform that helps businesses reach, monetize, and grow their global audiences through mobile
  advertising, mediation, and analytics. The company operates platforms including AppDiscovery (Axon) for performance-based user acquisition,
  MAX for in-app bidding mediation, Adjust for mobile measurement, and Wurl for connected TV. AppLovin provides SDKs and REST APIs that
  allow app developers and advertisers to integrate ad serving, monetization, campaign management, conversion tracking, and reporting
  capabilities into their applications.
