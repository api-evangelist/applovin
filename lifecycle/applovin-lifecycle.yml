status_page:
  url: null
  found: false
  evidence:
  - {url: 'https://applovin.statuspage.io', status: 200, result: 'redirects to /inactive — the Statuspage account exists but has been deactivated'}
  - {url: 'https://status.applovin.com', status: 0, result: NXDOMAIN — host does not resolve}
  - {url: 'https://status.axon.ai', status: 0, result: NXDOMAIN — host does not resolve}
  note: >-
    AppLovin operates NO status page. This is a specific, checkable finding rather than an
    absence of search: applovin.statuspage.io resolves and returns 200, but Statuspage
    serves it at /inactive, meaning AppLovin provisioned a status page at some point and
    then let it lapse. No StatusPage pointer is emitted in apis.yml, because there is
    nothing for a caller to check during an incident.
support:
