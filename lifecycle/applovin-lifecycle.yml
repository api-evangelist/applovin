generated: '2026-08-13'
method: searched
source: https://support.applovin.com/sitemap.xml + direct probes
versioning:
  scheme: uri-path
  current:
    axon-campaign-management: v1
    max-ad-unit-management: v1
    conversion-api: v1
    ad-review-rules: v1
    reporting: unversioned
  docs: https://support.applovin.com
  policy_url: null
  note: >-
    No published versioning policy. Four products carry a /v1 path segment; the entire
    reporting family (maxReport, report, assetReport, assetAnalyticsReport, webReport,
    maxCohort, max/userAdRevenueReport) carries no version at all, so there is no mechanism
    by which AppLovin could ship a breaking reporting change without breaking callers.
deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    No deprecation policy, no Sunset or Deprecation response headers, no advance-notice
    commitment published anywhere in the developer documentation. Searched the full
    support.applovin.com sitemap for a deprecation, sunset, migration, or end-of-life page
    for the API surface — none exists.
  in_product_deprecation:
    note: >-
      "deprecate" IS a first-class VERB in the MAX Ad Unit Management API: a waterfall or
      an A/B experiment can be deprecated by the customer via updateAdUnitWaterfall /
      upsertAdUnitExperiment. That is a customer-facing lifecycle operation on the
      customer's own configuration — it is not AppLovin deprecating an API, and must not be
      read as a deprecation policy.
    operations:
    - openapi/applovin-waterfalls-api-openapi.yml#updateAdUnitWaterfall
    - openapi/applovin-experiments-api-openapi.yml#upsertAdUnitExperiment
    - openapi/applovin-experiments-api-openapi.yml#updateAdUnitExperimentWaterfall
deprecated_operations: []
