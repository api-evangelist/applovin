note: >-
  AppLovin serves NO /.well-known/ documents on any host in its API surface. Two distinct
  failure shapes were observed and both are recorded below because they read very
  differently in a raw status log:
  (1) the API hosts return honest 404s (api.ads.axon.ai, nginx) or a blanket 400
  (r.applovin.com rejects any path it does not route);
  (2) the marketing and docs hosts (www.applovin.com, axon.ai, developers.applovin.com,
  support.applovin.com / support.axon.ai) are Next.js applications with a catch-all route
  that answers HTTP 200 with the site's HTML shell for EVERY /.well-known/* path,
  including paths that cannot exist. Those 200s are NOT documents. Each is recorded with
  status 200 and body: html-spa-shell so it is never mistaken for a hit.
  Because nothing returned a real document, this file emits NO WellKnown and NO SecurityTxt
  pointer in apis.yml. The probe is the finding.
