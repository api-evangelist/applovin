reporting_joins:
  note: >-
    Reporting rows are flat and carry no links, but they do carry join keys back into the
    two entity domains. These are the only cross-domain seams in the surface.
  keys:
  - {report_column: max_ad_unit_id, joins_to: AdUnit.id, domain: monetization}
  - {report_column: campaign_id, joins_to: Campaign.id, domain: advertising}
  - {report_column: campaign_id_external, joins_to: Campaign.hashed_ids, domain: advertising, note: 'Also equals the {CAMPAIGN_ID} click macro.'}
  - {report_column: creative_set_id, joins_to: CreativeSet.id, domain: advertising}
  - {report_column: asset_id, joins_to: Asset.id, domain: advertising}
gaps:
- No Account, User, Organization or App entity is exposed. account_id exists only as a required query parameter on the Campaign Management API.
- No relationship of any kind between the monetization and advertising domains. A publisher's ad units and an advertiser's campaigns are unreachable from one another.
- TestDevice is an orphan — it configures SDK behaviour but has no modelled link to any AdUnit.
- Three id spaces for a campaign (id, hashed_ids, campaign_id_external) with no endpoint that translates between them.
- Waterfall and AdNetworkSetting are duplicated verbatim across three specs because AppLovin exposes the same object through three endpoints.
