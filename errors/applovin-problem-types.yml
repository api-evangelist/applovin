format: proprietary
rfc9457: false
envelope:
  transport: response-headers
  headers:
  - name: x-al-error-code
    description: Numeric AppLovin error code. Present on Campaign Management API failures.
  - name: x-al-error-message
    description: Human-readable message for the error code.
  - name: X-TRACE-ID
    description: >-
      Returned on ALL responses, success or failure. AppLovin support requires this value
      on every ticket to trace a request.
  note: >-
    AppLovin does not use application/problem+json and does not publish a JSON error body
    schema for any REST product. Error semantics travel in headers. An agent that reads
    only the response body sees a status code and nothing else.
published_codes:
- code: 100007
  http_status: 429
  header: x-al-error-code
  api: Axon Campaign Management API
  title: Account temporarily blocked for error-rate abuse
  description: >-
    Returned for 24 hours after an account generates 100 error responses within a
    five-minute window. Every request during the block fails with 429 and this code. For
    asset uploads, each asset returning file_status FAILURE counts as an individual error.
  remediation: >-
    Stop retrying. Fix the underlying request before calling again — a retry loop against
    a 400 is what triggers this, and the penalty is a full day of downtime for the account,
    not just the failing call.
  source: https://support.applovin.com/en/app-discovery/api/axon-campaign-management-api/
