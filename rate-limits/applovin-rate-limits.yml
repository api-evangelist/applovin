specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: AppLovin
providerId: applovin
generated: '2026-08-13'
method: searched
source: https://support.applovin.com/en/app-discovery/api/axon-campaign-management-api/
created: '2026-05-22'
modified: '2026-08-13'
tags:
- Advertising
- Mobile
- AdTech
- App Monetization
- Mediation
- User Acquisition
- Marketing Technology
