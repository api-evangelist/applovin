pricing_model:
  type: media-spend
  api_pricing: none
  description: >-
    AppLovin does not sell API access. It is an advertising marketplace: advertisers pay
    for media (campaign spend through AppDiscovery / Axon) and publishers earn a revenue
    share on mediated impressions (MAX). The APIs are account management and reporting
    tooling that ships with the advertising relationship at no separate charge, so there is
    no API price, no quota to buy, and no upgrade path. The rate limits in
    rate-limits/applovin-rate-limits.yml are flat per-account limits, not tier limits —
    there is no higher tier to move to.
  api_access_requires: An AppLovin advertiser or publisher account, self-serve at https://dash.applovin.com
